<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc">
<title id="title">Esther’s skills and tools</title>
<desc id="desc">A single outlined panel grouping Esther’s programming, data, automation, systems, design, and workspace tools.</desc>
<style>
  :root { --ink:#333238; --muted:#77747C; --rule:#C9C7CC; --paper:#FFFFFF; }
  @media (prefers-color-scheme:dark) { :root { --ink:#E6E4E8; --muted:#A09DA5; --rule:#4A474F; --paper:#0D1117; } }
  .mono { font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }
  .sans { font-family:Arial,Helvetica,sans-serif; }
</style>
<rect x="16" y="16" width="968" height="333" rx="12" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.3"/>
<text class="mono" x="48" y="53" font-size="11" letter-spacing="2.6" fill="var(--muted)">SKILLS  /  TOOLS I USE</text>
<path d="M48 70H952" stroke="var(--rule)" stroke-width="1"/>
<g class="mono" font-size="11" letter-spacing="1.5" fill="var(--muted)">
