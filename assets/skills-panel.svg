  <text x="48" y="149">DATA</text>
  <text x="48" y="193">AUTOMATION</text>
  <text x="48" y="237">SYSTEMS</text>
  <text x="48" y="281">DESIGN &amp; ANALYSIS</text>
  <text x="48" y="325">WORKSPACE &amp; GIS</text>
</g>
<g class="sans" font-size="16" fill="var(--ink)">
  <text x="280" y="105">C++  ·  Python  ·  JavaScript  ·  HTML  ·  CSS</text>
  <text x="280" y="149">SQL  ·  MySQL  ·  Google Sheets</text>
