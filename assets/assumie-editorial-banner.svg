<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Esther Lee Qian Hui — software development student</title>
<desc id="desc">Minimal monochrome profile header with fine editorial rules and a small hand-drawn sound wave.</desc>
<style>
  :root { --ink:#333238; --muted:#77747C; --rule:#C9C7CC; --wave:#88838F; }
  @media (prefers-color-scheme:dark) { :root { --ink:#E6E4E8; --muted:#A09DA5; --rule:#4A474F; --wave:#A9A4AF; } }
  .mono { font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }
  .draw { stroke-dasharray:500; stroke-dashoffset:500; animation:draw 1.4s cubic-bezier(.6,0,.2,1) .25s forwards; }
  .rise { opacity:0; animation:rise .75s cubic-bezier(.2,.7,.2,1) .2s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes rise { to { opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .draw { animation:none; stroke-dashoffset:0; } .rise { animation:none; opacity:1; } }
</style>
<text class="mono" x="48" y="34" font-size="11" letter-spacing="3" fill="var(--muted)">ESTHER LEE QIAN HUI  /  ASSUMIE</text>
<text class="mono" x="952" y="34" text-anchor="end" font-size="11" letter-spacing="3" fill="var(--muted)">MELAKA, MALAYSIA</text>
<path d="M48 52H952" stroke="var(--rule)" stroke-width="1"/>
<g class="rise">
  <text class="mono" x="46" y="154" font-size="58" letter-spacing="-2.5" fill="var(--ink)">Esther Lee Qian Hui</text>
  <text class="mono" x="49" y="194" font-size="16" fill="var(--muted)">Software development student · UTeM</text>
</g>
<path class="draw" d="M711 236 C724 236 724 219 737 219 S750 253 763 253 776 206 789 206 802 246 815 246 828 226 841 226 854 236 867 236 880 217 893 217 906 240 919 240 932 228 952 228" stroke="var(--wave)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M48 278H952" stroke="var(--rule)" stroke-width="1"/>
<text class="mono" x="48" y="305" font-size="10" letter-spacing="2.4" fill="var(--muted)">SOFTWARE  ·  SMALL PROJECTS  ·  SINGING</text>
<text class="mono" x="952" y="305" text-anchor="end" font-size="10" letter-spacing="2.4" fill="var(--muted)">PROFILE / 2026</text>
