<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Esther Lee Qian Hui — software development student</title>
<desc id="desc">Minimal monochrome profile header with fine editorial rules and a compact CD labeled Assumie Mix 01.</desc>
<style>
  :root { --ink:#333238; --muted:#77747C; --rule:#C9C7CC; --disc:#ECEBED; --shine:#B9B6BE; --label:#F8F7F8; }
  @media (prefers-color-scheme:dark) { :root { --ink:#E6E4E8; --muted:#A09DA5; --rule:#4A474F; --disc:#28272D; --shine:#6D6973; --label:#44414A; } }
  .mono { font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }
  .rise { opacity:0; animation:rise .75s cubic-bezier(.2,.7,.2,1) .2s forwards; }
  @keyframes rise { to { opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .rise { animation:none; opacity:1; } }
</style>
<text class="mono" x="48" y="34" font-size="11" letter-spacing="3" fill="var(--muted)">ESTHER LEE QIAN HUI  /  ASSUMIE</text>
<text class="mono" x="952" y="34" text-anchor="end" font-size="11" letter-spacing="3" fill="var(--muted)">MELAKA, MALAYSIA</text>
<path d="M48 52H952" stroke="var(--rule)" stroke-width="1"/>
<g class="rise">
  <text class="mono" x="46" y="154" font-size="58" letter-spacing="-2.5" fill="var(--ink)">Esther Lee Qian Hui</text>
  <text class="mono" x="49" y="194" font-size="16" fill="var(--muted)">Software development student · UTeM</text>
</g>
<g aria-label="CD illustration">
  <circle cx="818" cy="166" r="99" fill="var(--disc)" stroke="var(--rule)" stroke-width="1.2"/>
  <circle cx="818" cy="166" r="87" stroke="var(--shine)" stroke-width="1"/>
  <circle cx="818" cy="166" r="77" stroke="var(--shine)" stroke-width="1" opacity=".72"/>
  <circle cx="818" cy="166" r="66" stroke="var(--shine)" stroke-width="1" opacity=".62"/>
  <circle cx="818" cy="166" r="55" stroke="var(--shine)" stroke-width="1" opacity=".54"/>
  <circle cx="818" cy="166" r="43" fill="var(--label)" stroke="var(--rule)" stroke-width="1"/>
  <text class="mono" x="818" y="158" text-anchor="middle" font-size="6.5" letter-spacing="1.4" fill="var(--muted)">ASSUMIE</text>
  <circle cx="818" cy="166" r="4.5" fill="var(--disc)" stroke="var(--rule)" stroke-width="1"/>
  <text class="mono" x="818" y="184" text-anchor="middle" font-size="6.5" letter-spacing="1.2" fill="var(--muted)">MIX 01</text>
</g>
<path d="M48 278H952" stroke="var(--rule)" stroke-width="1"/>
<text class="mono" x="48" y="305" font-size="10" letter-spacing="2.4" fill="var(--muted)">SOFTWARE  ·  SMALL PROJECTS  ·  SINGING</text>
<text class="mono" x="952" y="305" text-anchor="end" font-size="10" letter-spacing="2.4" fill="var(--muted)">PROFILE / 2026</text>
</svg>